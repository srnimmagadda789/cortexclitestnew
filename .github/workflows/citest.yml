name: Docker Image Security Scan

on:
  push:
    branches: [ "cortex-cli" ]

jobs:
  scan-image:
    runs-on: ubuntu-latest
    environment: Cortex
    env:
      CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
      CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
      CORTEX_API_URL: ${{ secrets.CORTEX_API_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull DVWA Image
        run: docker pull vulnerables/web-dvwa:latest

      - name: Download cortexcli
        run: |
          crtx_resp=$(curl -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" -H "Authorization: ${CORTEX_API_KEY}" "${CORTEX_API_URL}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64")
          crtx_url=$(echo $crtx_resp | jq -r ".signed_url")
          curl -L -o cortexcli "$crtx_url"
          chmod +x cortexcli
          ./cortexcli --version

      # --- NEW DEBUG STEP ---
      - name: Debug Cortex Path and Files
        run: |
         echo "Checking path: $HOME/.cortexcli/cortexcli-log/logs/"
         if [ -d "$HOME/.cortexcli/logs/" ]; then
            echo "✅ Log directory exists."
            ls -la "$HOME/.cortexcli/logs/"
         else
            echo "❌ Log directory does not exist."
            # Check the parent directory to see what IS there
            ls -la "$HOME/.cortexcli" || echo "Parent .cortexcli directory also missing."
         fi

      - name: Scan Image with Cortex
        run: |
          sudo ./cortexcli --api-base-url "${CORTEX_API_URL}" --api-key-id "${CORTEX_API_KEY_ID}" --api-key "${CORTEX_API_KEY}" --log-level DEBUG image scan vulnerables/web-dvwa:latest > scan-results.json 2>&1 || true
      - name: Display Cortex Logs
        if: always()
        run: |
          echo "--- Checking for Cortex CLI logs ---"
          if [ -d "$HOME/.cortexcli/logs/" ]; then
            echo "Logs found! Printing all files in directory:"
            # This finds all files in the log dir and prints their contents
            find "$HOME/.cortexcli/logs/" -type f -exec echo "FILE: {}" \; -exec cat {} \;
          else
            echo "No log directory found at ~/.cortexcli/cortexcli-log/logs/"
          fi
      - name : Prepare logs for Upload
        if: always()
        run: |
          mkdir -p ./debug-logs-upload
          if [ -d "$HOME/.cortexcli/cortexcli-log" ]; then
            cp -r $HOME/.cortexcli/cortexcli-log/* ./debug-logs-upload/ || true
          fi
          if sudo [ -d "/root/.cortexcli/cortexcli-log" ]; then
             sudo cp -r /root/.cortexcli/cortexcli-log/* ./debug-logs-upload/ || true
             sudo chmod -R 777 ./debug-logs-upload/
          fi
          ls -R ./debug-logs-upload/
      - name: Upload Scan Results
        if: always() # Upload even if the scan fails
        uses: actions/upload-artifact@v4
        with:
          name: cortex-debug-bundle
          path: |
            scan-results.json
            debug-logs-upload/
            /home/runner/.cortexcli/cortexcli-log/logs/cortexcli-*.log
          if-no-files-found: warn
          compression-level: 6
