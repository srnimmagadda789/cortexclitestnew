name: Image Scan CortexCLI

permissions: {}

on:
  push:
    branches:
      - cortex-cli
  workflow_dispatch:
    
jobs:
  cortexcli:
    runs-on: ubuntu-latest
    environment: Cortex
    env:
      CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
      CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
      CORTEX_API_URL: ${{ secrets.CORTEX_API_URL }}
      WAIT: ${{ vars.WAIT || 900 }}
      IMAGE_NAME: "vulnerables/web-dvwa:latest"
      OUTPUT_FILE: ${{ vars.OUTPUT_FILE || 'scan-results.json' }}

    steps:
    - name: Checkout
      uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5

    # Install Pre-requisites
    - name: Install Prerequisites
      run: |
        sudo apt-get update
        # curl and jq are required for the download step and JSON parsing
        # libhyperscan5 is required for the AppSec module on Ubuntu AMD64
        sudo apt-get install -y curl jq libhyperscan5
        # prefetch is noted specifically for Ubuntu 20
        sudo apt-get install -y prefetch || echo "Prefetch utility not found or not required on this Ubuntu version."

    - name: Download cortexcli
      run: |
        crtx_resp=$(curl -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" -H "Authorization: ${CORTEX_API_KEY}" "${CORTEX_API_URL}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64")
        crtx_url=$(echo $crtx_resp | jq -r ".signed_url")
        curl -o cortexcli $crtx_url
        chmod +x cortexcli
        ./cortexcli --version

    # View all CLI options for troubleshooting
    - name: View CortexCLI Help Options
      run: |
        echo "=== Global Help ==="
        ./cortexcli --help
        echo "=== Image Scan Help ==="
        ./cortexcli image scan --help || true

    # Pull the vulnerable target image (Hardcoded)
    - name: Pull Vulnerable Image and export image ID
      run: |
        docker pull vulnerables/web-dvwa:latest
        image_id=$(docker inspect vulnerables/web-dvwa:latest --format='{{.Id}}')
        echo "IMAGE_ID=$image_id" >> $GITHUB_ENV

    # Note the global flags (including --soft-fail) are placed BEFORE 'image scan'
    - name: Cortex CLI Image Scan
      run: |
        sudo ./cortexcli \
          --api-base-url "${CORTEX_API_URL}" \
          --api-key "${CORTEX_API_KEY}" \
          --api-key-id "${CORTEX_API_KEY_ID}" \
          --log-level DEBUG \
          --soft-fail \
          image scan \
          --output-format json \
          purple-broccoli

    - name: Wait for results
      run: | 
        echo "Waiting for Cortex to process image $IMAGE_NAME. Image Id: ${IMAGE_ID}"
        sleep ${WAIT}

    - name: Get Results
      run : |
        echo "Obtaining findings of image: $IMAGE_NAME. Image Id: $IMAGE_ID"
        start_response=$(curl -s -X POST -H "Content-Type: application/json" -H "Authorization: ${CORTEX_API_KEY}" -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" "${CORTEX_API_URL}/public_api/v1/xql/start_xql_query" -d '
            {
                "request_data": {
                    "query": "dataset = findings | filter xdm.finding.asset_name = \"'$IMAGE_ID'\""
                }
            }')
        query_id=$(echo "$start_response" | jq -r '.reply')

        if [[ "$query_id" != *"_inv" ]]; then
            echo "❌ Failed to start XQL query. Response details:"
            echo "$start_response"
            exit 1
        fi

        echo "XQL Query started successfully. Query ID: ${query_id}"

        # Define initial status
        echo "Retrieving results for Query ID: ${query_id}. Waiting for completion (pending_flag=true)..."
        status="PENDING"

        while [[ "$status" == "PENDING" ]]; do
            # Execute API call to get results
            results_response=$(curl -s -X POST -H "Content-Type: application/json" -H "Authorization: ${CORTEX_API_KEY}" -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" "${CORTEX_API_URL}/public_api/v1/xql/get_query_results" -d '
                {
                    "request_data": {
                        "query_id": "'$query_id'", 
                        "pending_flag": true, 
                        "limit": 100, 
                        "format": "json"
                    }
                }')
            status=$(echo "$results_response" | jq -r '.reply.status')
            sleep 10
        done

        echo "Retrieve results status: $status"
        # Print the full response for troubleshooting
        if [[ "$status" == "SUCCESS" ]]; then
          echo "$results_response" | jq '.reply.results.data' | jq 'map(.image_name = "'$IMAGE_NAME'")' > "image-${{ env.OUTPUT_FILE }}"
        fi

    
    - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
      with:
        name: image-scan-results
        path: "image-${{ env.OUTPUT_FILE }}"
